[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coundetrip"
version = "0.1.0"
description = "Roundtrip benchmark: natural language as source, code as generated artifact"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.9.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
coundetrip = "coundetrip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
